publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  permission_handler: '>=11.0.0 <13.0.0'
  pdfrx: '>=2.0.0 <3.0.0'
  epubx: ^4.0.0
  archive: ^3.0.0
  xml: ^6.0.0
  flutter_widget_from_html_core: '>=0.15.0 <1.0.0'

flutter:
  uses-material-design: true
